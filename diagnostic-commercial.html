<!doctype html><meta charset="utf-8"><title>Diagnostyka nieruchomości komercyjnych – Combined API</title><style>body{font:16px Arial;max-width:1100px;margin:40px auto;padding:20px}button{font-size:18px;padding:12px 20px}pre{white-space:pre-wrap;background:#f4f4f4;padding:15px;border-radius:8px;max-height:75vh;overflow:auto}</style><h1>Diagnostyka nieruchomości komercyjnych – Combined API</h1><p>Olsztyn · <b>Nieruchomość komercyjna</b> · <b>100 m²</b> · zakres <b>50–150 m²</b> · promień 0 km</p><p>Test obejmuje źródła komercyjne oraz deduplikację między portalami. Wynik pokazuje pełny JSON zwrócony przez API.</p><button onclick="run()">URUCHOM TEST KOMERCYJNY</button><pre id="out">Gotowe.</pre><script>async function run(){const o=document.getElementById('out');o.textContent='Uruchamiam pełny test nieruchomości komercyjnych…';try{const r=await fetch('/api/live/combined?location=Olsztyn&area=100&tolerance=50&radius=0&propertyType=Nieruchomo%C5%9B%C4%87%20komercyjna',{cache:'no-store'});const t=await r.text();o.textContent='HTTP '+r.status+'\n\n'+t}catch(e){o.textContent='BŁĄD: '+e.message}}</script>
