<!doctype html><meta charset="utf-8"><title>N-O diagnostic – domy</title><style>body{font:16px Arial;max-width:900px;margin:40px auto;padding:20px}button{font-size:18px;padding:12px 20px}pre{white-space:pre-wrap;background:#f4f4f4;padding:15px;border-radius:8px}</style><h1>Diagnostyka Nieruchomości-online</h1><p>Olsztyn · <b>dom</b> · <b>100 m²</b> · tolerancja <b>10%</b> · promień 0 km</p><p>Test kontrolny dynamicznego odcięcia ofert archiwalnych.</p><button onclick="run()">URUCHOM TEST DOMÓW N-O</button><pre id="out">Gotowe.</pre><script>async function run(){const o=document.getElementById('out');o.textContent='Uruchamiam…';try{const r=await fetch('/api/diagnostic-no?location=Olsztyn&area=100&tolerance=10&radius=0&propertyType=dom',{cache:'no-store'});const t=await r.text();o.textContent='HTTP '+r.status+'\n\n'+t}catch(e){o.textContent='BŁĄD: '+e.message}}</script>
