<!doctype html><meta charset="utf-8"><title>N-O diagnostic</title><style>body{font:16px Arial;max-width:900px;margin:40px auto;padding:20px}button{font-size:18px;padding:12px 20px}pre{white-space:pre-wrap;background:#f4f4f4;padding:15px;border-radius:8px}</style><h1>Diagnostyka Nieruchomości-online</h1><p>Test: Olsztyn · komercyjna · 100 m² · tolerancja 50% · promień 0 km</p><button onclick="run()">URUCHOM TEST N-O</button><pre id="out">Gotowe.</pre><script>async function run(){const o=document.getElementById('out');o.textContent='Uruchamiam…';try{const u='/api/diagnostic-no?location=Olsztyn&area=100&tolerance=50&radius=0';const r=await fetch(u,{cache:'no-store'});const t=await r.text();o.textContent='HTTP '+r.status+'\n\n'+t}catch(e){o.textContent='BŁĄD: '+e.message}}</script>
