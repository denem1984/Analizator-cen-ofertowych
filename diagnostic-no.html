<!doctype html><meta charset="utf-8"><title>Diagnostyka mieszkań – Combined API</title><style>body{font:16px Arial;max-width:1000px;margin:40px auto;padding:20px}button{font-size:18px;padding:12px 20px}pre{white-space:pre-wrap;background:#f4f4f4;padding:15px;border-radius:8px}</style><h1>Diagnostyka mieszkań – Combined API</h1><p>Olsztyn · <b>mieszkanie</b> · <b>62 m²</b> · zakres <b>60–65 m²</b> · promień 0 km</p><p>Test obejmuje Nieruchomości-online, Morizon, Domiporta, Gratka i Adresowo oraz deduplikację.</p><button onclick="run()">URUCHOM TEST MIESZKAŃ</button><pre id="out">Gotowe.</pre><script>async function run(){const o=document.getElementById('out');o.textContent='Uruchamiam pełny test mieszkań…';try{const r=await fetch('/api/live/combined?location=Olsztyn&area=62&tolerance=4.0322580645&radius=0&propertyType=mieszkanie',{cache:'no-store'});const t=await r.text();o.textContent='HTTP '+r.status+'\n\n'+t}catch(e){o.textContent='BŁĄD: '+e.message}}</script>
