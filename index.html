<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analizator Cen Ofertowych</title><style>
:root{--bg:#08111f;--panel:#12233a;--line:#29415e;--text:#eef4fb;--muted:#9db0c7;--accent:#25e0c4;--danger:#ff7c7c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08111f,#0e1a2c);color:var(--text);font:14px/1.45 Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.card{background:#12233af5;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{margin:0;font-size:18px}.search-grid{display:grid;grid-template-columns:1.7fr 1.1fr .8fr .9fr 1.2fr;gap:12px;align-items:start}.field{position:relative}.field label{display:block;color:#c9d6e6;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;height:44px;border:1px solid #36506e;border-radius:8px;background:#0d1b2e;color:var(--text);padding:0 12px;font-size:14px}.location-status{position:absolute;top:72px;left:0;font-size:12px;white-space:nowrap;color:var(--muted)}.location-status.ok{color:var(--accent)}.location-status.err{color:var(--danger)}.search-grid .field:first-child{padding-bottom:25px}.search-grid button{grid-column:1;grid-row:2}.primary{height:44px;border:0;border-radius:8px;background:var(--accent);color:#06201c;font-weight:700;cursor:pointer}.pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#0e2035;border:1px solid var(--line);color:var(--accent);font-weight:700;font-size:12px}.source-picker-wrap{position:relative}.source-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;width:300px;background:#10223a;border:1px solid #3b5878;border-radius:10px;box-shadow:0 10px 30px #0006;padding:8px}.source-menu-head{padding:7px 9px 9px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.source-option{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;cursor:pointer}.source-option:hover{background:#193451}.source-option input{width:16px;height:16px;accent-color:var(--accent)}.source-option span{font-weight:700}.source-option small{display:block;color:var(--muted);font-size:11px}.source-actions{display:flex;gap:7px;padding-top:8px;margin-top:4px;border-top:1px solid var(--line)}.source-actions button{height:32px;padding:0 10px;background:#0d1d32;color:#c9d6e6;border:1px solid #36506e;border-radius:7px;font-size:11px}.source-status{font-size:11px;color:var(--muted);margin-top:6px}.hidden{display:none!important}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#0d1d32;border:1px solid #1f3652;border-radius:9px;padding:14px}.stat .n{font-size:24px;font-weight:700;color:var(--accent)}.stat .l{font-size:12px;color:#a9bad0}.range{margin-top:10px;color:#b8c7d8}.range strong{color:var(--accent)}.source-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.source{background:#0d1d32;border:1px solid #1f3652;border-radius:9px;padding:12px;min-height:105px}.source h3{margin:0 0 8px;color:var(--accent);font-size:13px}.source div{font-size:12px;color:#c1cfde}.source-disabled{opacity:.45}.offers-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.offers{width:100%;border-collapse:collapse;min-width:980px}.offers th{background:#0c1b2e;color:#9fb5cd;text-align:left;font-size:11px;text-transform:uppercase;padding:10px;cursor:pointer;position:sticky;top:0;z-index:2}.offers th:hover,.offers th.active{color:var(--accent)}.offers td{padding:9px 10px;border-top:1px solid #243b56;white-space:nowrap}.offers tr:hover{background:#152b46}.offers a{color:var(--accent);font-weight:700}.price,.pm2{font-weight:700}.meta{color:var(--muted)}.error{background:#351d26;border:1px solid #74404b;color:#ffd1d1;padding:14px;border-radius:9px}.suggestions{position:absolute;z-index:30;left:0;right:0;top:72px;background:#10223a;border:1px solid #3b5878;border-radius:8px;display:none}.suggestion{padding:10px 12px;border-bottom:1px solid #263d58;cursor:pointer}.suggestion:hover{background:#193451}.filter-range{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{padding:18px;color:var(--muted)}@media(max-width:1100px){.search-grid{grid-template-columns:1fr 1fr}.search-grid button{grid-column:1/-1;grid-row:auto}.source-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.wrap{padding:10px}.search-grid,.summary-grid,.source-grid{grid-template-columns:1fr}.source-menu{position:fixed;left:12px;right:12px;top:70px;width:auto}}
</style></head><body><div class="wrap">
<section class="card"><div class="section-title"><h2>Wyszukiwanie ofert</h2><div class="source-picker-wrap"><button id="sourcePickerBtn" type="button" class="pill">Źródła danych</button><div id="sourceMenu" class="source-menu hidden"></div></div></div><div class="search-grid"><div class="field"><label>Lokalizacja</label><input id="location" autocomplete="off" placeholder="Wpisz miejscowość, np. Olsztyn"><div id="suggestions" class="suggestions"></div><div id="locationStatus" class="location-status">Wybierz miejscowość z podpowiedzi TERYT lub wpisz pełną nazwę.</div></div><div class="field"><label>Rodzaj nieruchomości</label><select id="propertyType"><option value="mieszkanie">Mieszkanie</option><option value="dom">Dom</option><option value="działka">Działka</option><option value="Nieruchomość komercyjna">Nieruchomość komercyjna</option></select></div><div class="field" id="areaField"><label>Powierzchnia (m²)</label><input id="area" type="number" min="0.01" step="0.01" value="62"></div><div class="field"><label>Promień</label><select id="radius"><option value="0">0 km</option><option value="1">1 km</option><option value="2">2 km</option><option value="5">5 km</option><option value="10">10 km</option><option value="20">20 km</option><option value="30">30 km</option></select></div><div class="field"><label>Filtr powierzchni</label><select id="filterMode"><option value="none">Bez filtra powierzchni</option><option value="percent" selected>Filtr procentowy</option><option value="range">Filtr powierzchniowy</option></select><select id="tolerance" style="margin-top:8px"><option value="10">±10%</option><option value="20" selected>±20%</option><option value="30">±30%</option><option value="40">±40%</option><option value="50">±50%</option></select><div id="rangeFields" class="filter-range hidden" style="margin-top:8px"><input id="minArea" type="number" min="0.01" step="0.01" placeholder="Od (m²)"><input id="maxArea" type="number" min="0.01" step="0.01" placeholder="Do (m²)"></div></div><button id="searchBtn" class="primary">SZUKAJ OFERT</button></div></section>
<div id="results" class="hidden"><section class="card"><div class="section-title"><h2>Wynik wspólny</h2><span id="queryInfo" class="meta"></span></div><div class="summary-grid"><div class="stat"><div id="filtered" class="n">0</div><div class="l">ofert po filtrze powierzchni</div></div><div class="stat"><div id="duplicates" class="n">0</div><div class="l">usuniętych duplikatów</div></div><div class="stat"><div id="accepted" class="n">0</div><div class="l">przyjętych do analizy</div></div></div><div id="range" class="range"></div></section><section class="card"><div class="section-title"><h2>Podsumowanie źródeł</h2><span id="sourceStatus" class="source-status"></span></div><div id="sources" class="source-grid"></div></section><section class="card"><div class="section-title"><h2>Oferty</h2><span id="offerCount" class="pill"></span></div><div id="offers"></div></section></div><div id="message" class="hidden"></div></div>
<script>
const $=id=>document.getElementById(id);let currentOffers=[],sourceCatalog=[],sourceSelection={},sortKey=null,sortDir=1,suggestTimer=null;
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function num(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pl-PL',{maximumFractionDigits:2}):'—'}function money(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pl-PL',{maximumFractionDigits:0})+' zł':'—'}function pm2(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('pl-PL',{maximumFractionDigits:0})+' zł/m²':'—'}function sname(s){if(typeof s==='string')return s.trim()||'Źródło';return String(s?.portal||s?.source||'Źródło').trim()||'Źródło'}
function buildSourceCatalog(data){const map=new Map();for(const s of Array.isArray(data?.sources)?data.sources:[]){const n=sname(s);if(!map.has(n))map.set(n,{...s,portal:s.portal||s.source||n,offers:Array.isArray(s.offers)?s.offers:[]})}for(const o of Array.isArray(data?.offers)?data.offers:[]){const n=sname(o);if(!map.has(n))map.set(n,{portal:n,source:n,offers:[]})}return [...map.values()]}
function selectedSources(){return sourceCatalog.filter(s=>sourceSelection[sname(s)]!==false)}
function updateSourceButton(){const total=sourceCatalog.length,active=selectedSources().length;$('sourcePickerBtn').textContent=total?(active===total?`${total} źródeł danych`:`${active}/${total} źródeł`):'Źródła danych';$('sourceStatus').textContent=total?`Aktywne: ${active} z ${total}`:'';}
function renderSourceMenu(){if(!sourceCatalog.length&&window.lastData){sourceCatalog=buildSourceCatalog(window.lastData);sourceCatalog.forEach(s=>{if(!(sname(s) in sourceSelection))sourceSelection[sname(s)]=true})}const total=sourceCatalog.length,active=selectedSources().length;const menu=$('sourceMenu');menu.innerHTML=`<div class="source-menu-head">Wybierz portale uwzględniane w tej analizie.<br>Zmiana działa natychmiast — bez ponownego pobierania ofert.</div>${sourceCatalog.length?sourceCatalog.map(s=>{const n=sname(s),checked=sourceSelection[n]!==false;return `<label class="source-option"><input type="checkbox" data-source="${esc(n)}" ${checked?'checked':''}><span>${esc(n)}<small>${checked?'Uwzględnione w analizie':'Wyłączone z analizy'}</small></span></label>`}).join(''):'<div class="empty">Brak listy źródeł w wyniku wyszukiwania.</div>'}<div class="source-actions"><button type="button" id="selectAllSources">Zaznacz wszystkie</button><button type="button" id="clearAllSources">Odznacz wszystkie</button></div><div class="source-status">Aktywne: ${active} z ${total}</div>`;menu.querySelectorAll('input[data-source]').forEach(cb=>cb.onchange=()=>{sourceSelection[cb.dataset.source]=cb.checked;recalculate()});$('selectAllSources').onclick=()=>{sourceCatalog.forEach(s=>sourceSelection[sname(s)]=true);recalculate()};$('clearAllSources').onclick=()=>{sourceCatalog.forEach(s=>sourceSelection[sname(s)]=false);recalculate()}}
function urlKey(v){try{const u=new URL(String(v||''),location.href);u.hash='';u.search='';return u.href.replace(/\/$/,'').toLowerCase()}catch{return String(v||'').trim().toLowerCase().replace(/\/$/,'')}}
function dedupe(rows){const seen=new Set(),seenUrl=new Set(),out=[],dups=[];for(const o of rows){const p=Number(o.price),a=Number(o.area),k=Number.isFinite(p)&&Number.isFinite(a)?`${p}|${a}`:'',u=urlKey(o.url);if((k&&seen.has(k))||(u&&seenUrl.has(u))){dups.push(o);continue}if(k)seen.add(k);if(u)seenUrl.add(u);out.push(o)}return{rows:out,dups}}
function recalculate(){const active=selectedSources();const all=active.flatMap(s=>(Array.isArray(s.offers)?s.offers:[]).map(o=>({...o,source:o.source||o.portal||sname(s),portal:o.portal||sname(s)})));const d=dedupe(all);currentOffers=d.rows;const acceptedBy={};const dupBy={};sourceCatalog.forEach(s=>{acceptedBy[sname(s)]=0;dupBy[sname(s)]=0});d.rows.forEach(o=>acceptedBy[sname(o)]++);d.dups.forEach(o=>dupBy[sname(o)]++);const internal=active.reduce((n,s)=>n+Number(s.internalDuplicatesRemoved||0),0);$('filtered').textContent=num(active.reduce((n,s)=>n+Number(s.filtered??(s.offers||[]).length),0));$('duplicates').textContent=num(internal+d.dups.length);$('accepted').textContent=num(currentOffers.length);const areas=currentOffers.map(o=>Number(o.area)).filter(Number.isFinite);$('range').innerHTML=areas.length?`Zakres powierzchni: <strong>${num(Math.min(...areas))} m² – ${num(Math.max(...areas))} m²</strong>`:'';$('sources').innerHTML=sourceCatalog.map(s=>{const n=sname(s),on=sourceSelection[n]!==false,filtered=Number(s.filtered??(s.offers||[]).length),inDup=Number(s.internalDuplicatesRemoved||0),exDup=dupBy[n]||0,acc=acceptedBy[n]||0;return `<div class="source ${on?'':'source-disabled'}"><h3>${esc(n)}</h3>${on?`<div>ilość ofert po filtrze: <b>${num(filtered)}</b></div><div>duplikaty wewnętrzne: <b>${num(inDup)}</b></div><div>duplikaty zewnętrzne: <b>${num(exDup)}</b></div><div>usunięte duplikaty łącznie: <b>${num(inDup+exDup)}</b></div><div>przyjęto: <b>${num(acc)}</b></div>`:'<div>Wyłączone z analizy</div>'}</div>`}).join('');updateSourceButton();renderSourceMenu();renderOffers()}
function sortVal(o,k){if(k==='type')return o.type||'';if(k==='location')return [o.locality,o.street].filter(Boolean).join(', ')||o.location||'';if(k==='source')return o.source||o.portal||'';if(k==='price')return Number(o.price);if(k==='area')return Number(o.area);if(k==='priceM2')return Number(o.priceM2);return ''}function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}renderOffers()}
function renderOffers(){const a=[...currentOffers].sort((x,y)=>{const X=sortVal(x,sortKey),Y=sortVal(y,sortKey);if(typeof X==='number'&&typeof Y==='number')return((Number.isNaN(X)?Infinity:X)-(Number.isNaN(Y)?Infinity:Y))*sortDir;return String(X).localeCompare(String(Y),'pl',{numeric:true,sensitivity:'base'})*sortDir});const h=k=>`<th class="${sortKey===k?'active':''}" onclick="sortBy('${k}')">${({lp:'LP',type:'Typ',location:'Lokalizacja / adres',source:'Źródło',price:'Cena',area:'Powierzchnia',priceM2:'Cena/m²'})[k]} ${sortKey===k?(sortDir===1?'▲':'▼'):'↕'}</th>`;$('offerCount').textContent=a.length+' ofert';if(!a.length){$('offers').innerHTML='<div class="empty">Brak ofert w aktualnie wybranych źródłach.</div>';return}$('offers').innerHTML=`<div class="offers-wrap"><table class="offers"><thead><tr>${h('lp')}${h('type')}${h('location')}${h('source')}<th>URL</th>${h('price')}${h('area')}${h('priceM2')}</tr></thead><tbody>${a.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.type||window.lastData?.propertyType||'')}</td><td>${esc([o.locality,o.street].filter(Boolean).join(', ')||o.location||'—')}</td><td>${esc(o.source||o.portal||'—')}</td><td><a href="${esc(o.url||'#')}" target="_blank" rel="noopener">Otwórz</a></td><td class="price">${money(o.price)}</td><td>${num(o.area)} m²</td><td class="pm2">${pm2(o.priceM2)}</td></tr>`).join('')}</tbody></table></div>`}
function render(data){window.lastData=data;sourceCatalog=buildSourceCatalog(data);sourceSelection={};sourceCatalog.forEach(s=>sourceSelection[sname(s)]=true);currentOffers=Array.isArray(data.offers)?data.offers:[];$('results').classList.remove('hidden');$('message').classList.add('hidden');$('queryInfo').textContent=`${data.location||''} · ${data.propertyType||''} · ${data.filterLabel||''} · promień ${num(data.radius)} km`;recalculate();$('sourceMenu').classList.add('hidden')}
$('sourcePickerBtn').onclick=e=>{e.stopPropagation();const m=$('sourceMenu');if(m.classList.contains('hidden')){renderSourceMenu();m.classList.remove('hidden')}else m.classList.add('hidden')};document.addEventListener('click',e=>{if(!e.target.closest('.source-picker-wrap'))$('sourceMenu').classList.add('hidden')});$('filterMode').onchange=()=>{const m=$('filterMode').value;$('areaField').classList.toggle('hidden',m!=='percent');$('tolerance').classList.toggle('hidden',m!=='percent');$('rangeFields').classList.toggle('hidden',m!=='range')};
async function suggestions(q){if(q.trim().length<2){$('suggestions').style.display='none';return}try{const r=await fetch('/api/location-suggestions?q='+encodeURIComponent(q),{cache:'no-store'}),rows=await r.json();$('suggestions').innerHTML=(Array.isArray(rows)?rows:[]).map((x,i)=>`<div class="suggestion" data-i="${i}"><b>${esc(x.name)}</b><br><small>${esc(x.powiat||'')}${x.wojewodztwo?' · '+esc(x.wojewodztwo):''}</small></div>`).join('');$('suggestions').style.display=rows.length?'block':'none';$('suggestions').querySelectorAll('.suggestion').forEach(el=>el.onclick=()=>{const x=rows[+el.dataset.i];$('location').value=x.name;$('locationStatus').textContent=`Lokalizacja potwierdzona: ${x.name}${x.powiat?' · pow. '+x.powiat:''}`;$('locationStatus').className='location-status ok';$('suggestions').style.display='none'})}catch{}}
$('location').oninput=e=>{clearTimeout(suggestTimer);$('locationStatus').textContent='Szukanie w słowniku TERYT…';suggestTimer=setTimeout(()=>suggestions(e.target.value),250)};
$('searchBtn').onclick=async()=>{const loc=$('location').value.trim(),mode=$('filterMode').value,pt=$('propertyType').value,r=Number($('radius').value);let area,tol,label;if(mode==='percent'){area=Number($('area').value);tol=Number($('tolerance').value);label=`pow. ${num(area)} m² ±${num(tol)}%`}else if(mode==='range'){const min=Number($('minArea').value),max=Number($('maxArea').value);if(!(min>0&&max>=min))return;$('area').value=(min+max)/2;area=(min+max)/2;tol=((max-min)/(min+max))*100;label=`pow. ${num(min)}–${num(max)} m²`}else{area=100;tol=9999;label='bez filtra powierzchni'}if(!loc)return;$('searchBtn').disabled=true;$('searchBtn').textContent='SZUKANIE…';try{const rr=await fetch('/api/resolve-location?location='+encodeURIComponent(loc),{cache:'no-store'});const resolved=await rr.json();const q=await fetch('/api/live/combined?location='+encodeURIComponent(resolved.name||loc)+'&area='+encodeURIComponent(area)+'&tolerance='+encodeURIComponent(tol)+'&radius='+encodeURIComponent(r)+'&propertyType='+encodeURIComponent(pt),{cache:'no-store'});const data=await q.json();if(!q.ok||data.error)throw new Error(data.error||'Błąd pobierania ofert');data.filterLabel=label;render(data)}catch(e){$('message').className='error';$('message').textContent=e.message;$('message').classList.remove('hidden')}finally{$('searchBtn').disabled=false;$('searchBtn').textContent='SZUKAJ OFERT'}};
</script></body></html>
