<!doctype html><meta charset="utf-8"><title>Diagnostyka działek – Combined API</title><style>body{font:16px Arial;max-width:1000px;margin:40px auto;padding:20px}button{font-size:18px;padding:12px 20px}pre{white-space:pre-wrap;background:#f4f4f4;padding:15px;border-radius:8px}</style><h1>Diagnostyka działek – Combined API</h1><p>Olsztyn · <b>działka</b> · <b>1000 m²</b> · tolerancja <b>10%</b> · promień 0 km</p><p>Test wszystkich aktualnie podłączonych portali: Nieruchomości-online, Morizon i Domiporta.</p><button onclick="run()">URUCHOM TEST DZIAŁEK</button><pre id="out">Gotowe.</pre><script>async function run(){const o=document.getElementById('out');o.textContent='Uruchamiam test działek…';try{const r=await fetch('/api/live/combined?location=Olsztyn&area=1000&tolerance=10&radius=0&propertyType=dzialka',{cache:'no-store'});const t=await r.text();o.textContent='HTTP '+r.status+'\n\n'+t}catch(e){o.textContent='BŁĄD: '+e.message}}</script>
