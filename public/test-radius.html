<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test promienia — Analizator Cen Ofertowych</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px}label{display:block;margin:10px 0 4px}input,button{font-size:16px;padding:9px;width:100%;box-sizing:border-box}button{margin-top:18px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f4f4f4;padding:14px;border-radius:8px}table{border-collapse:collapse;width:100%;margin-top:18px}td,th{border:1px solid #ccc;padding:8px;text-align:left}</style></head><body><h1>Test promienia wyszukiwania</h1><label>Lokalizacja</label><input id="location" value="Olsztyn"><label>Powierzchnia (m²)</label><input id="area" type="number" value="62"><label>Tolerancja (%)</label><input id="tolerance" type="number" value="10"><label>Promień (km)</label><input id="radius" type="number" value="20"><button onclick="run()">Uruchom wyszukiwanie</button><p id="status"></p><div id="result"></div><script>async function run(){const s=document.getElementById('status'),out=document.getElementById('result');s.textContent='Pobieram wyniki…';out.innerHTML='';const p=new URLSearchParams({location:document.getElementById('location').value,area:document.getElementById('area').value,tolerance:document.getElementById('tolerance').value,radius:document.getElementById('radius').value});try{const r=await fetch('/api/live/combined?'+p.toString());const data=await r.json();if(!r.ok)throw new Error(data.error||('HTTP '+r.status));s.textContent='Gotowe.';const rows=(data.sources||[]).map(x=>`<tr><td>${x.portal}</td><td>${x.filtered??0}</td><td>${x.requestedRadius??0} km</td><td>${x.appliedRadius?x.appliedRadius+' km':(x.searchScope||'tylko miejscowość')}</td><td>${x.httpStatus??''}</td></tr>`).join('');out.innerHTML='<table><thead><tr><th>Portal</th><th>Oferty</th><th>Żądany promień</th><th>Zastosowany zakres</th><th>HTTP</th></tr></thead><tbody>'+rows+'</tbody></table><h3>Pełny JSON</h3><pre>'+JSON.stringify(data,null,2).replace(/</g,'&lt;')+'</pre>'}catch(e){s.textContent='Błąd';out.innerHTML='<pre>'+String(e)+'</pre>'}}</script></body></html>
